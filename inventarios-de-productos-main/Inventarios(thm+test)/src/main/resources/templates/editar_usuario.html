<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Usuario</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="icon" href="Logo.png" type="logo"></head>
<body>
  <h2>Editar usuario</h2>
  <form th:action="@{/usuarios/editar/{id}(id=${usuario.id})}" method="post">
    <input type="text" name="nombre" th:value="${usuario.nombre}" required>
    <input type="email" name="correo" th:value="${usuario.correo}" required>
    <input type="password" name="contrasena" th:value="${usuario.contrasena}" required>
    <input type="text" name="rol" th:value="${usuario.rol}" required>
    <button type="submit">Guardar cambios</button>
  </form>
  <a th:href="@{/usuarios}">Volver</a>
</body>
</html>
