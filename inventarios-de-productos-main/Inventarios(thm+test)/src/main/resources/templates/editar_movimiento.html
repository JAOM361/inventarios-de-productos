<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Movimiento</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="icon" href="Logo.png" type="logo"></head>
<body>
<h1>Editar Movimiento</h1>

<form th:action="@{'/movimientos/editar/' + ${movimiento.id}}" method="post">
    <label>Tipo:</label>
    <select name="tipo">
        <option th:value="ENTRADA" th:selected="${movimiento.tipo == 'ENTRADA'}">ENTRADA</option>
        <option th:value="SALIDA" th:selected="${movimiento.tipo == 'SALIDA'}">SALIDA</option>
    </select>
    <br>

    <label>Cantidad:</label>
    <input type="number" name="cantidad" th:value="${movimiento.cantidad}" required>
    <br>

    <button type="submit">Guardar Cambios</button>
</form>

<a th:href="@{/movimientos}">Volver</a>
</body>
</html>
