<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
  <h1>Usuarios</h1>
  <div class="user-info" style="float: right; text-align: right;">
    <p th:text="${session.usuarioActual != null ? '👤 ' + session.usuarioActual.nombre : ''}"></p>
    <a th:href="@{/}" style="color: red; font-weight: bold;">Cerrar sesión</a>
  </div>
  <a th:href="@{/index}" style="color: red; font-weight: bold;">Volver</a>
</header>

<main>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.correo}"></td>
        <td th:text="${u.rol}"></td>
        <td>
          <a th:href="@{/usuarios/editar/{id}(id=${u.id})}">Editar</a> |
          <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>

  <h3>Agregar usuario</h3>
  <form th:action="@{/usuarios}" method="post" class="formulario">
    <label>Nombre: <input type="text" name="nombre" required /></label><br/>
    <label>Correo: <input type="email" name="correo" required /></label><br/>
    <label>Contraseña: <input type="password" name="contrasena" required /></label><br/>
    <label>Rol: <input type="text" name="rol" required /></label><br/>
    <button type="submit">Guardar</button>
  </form>
</main>
</body>
</html>
