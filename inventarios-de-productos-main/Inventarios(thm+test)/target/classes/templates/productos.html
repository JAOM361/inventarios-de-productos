<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
  <h1>Productos</h1>
  <div class="user-info" style="float: right; text-align: right;">
    <p th:text="${session.usuarioActual != null ? '👤 ' + session.usuarioActual.nombre : ''}"></p>
    <a th:href="@{/}" style="color: red; font-weight: bold;">Cerrar sesión</a>
  </div>
  <a th:href="@{/index}" style="color: red; font-weight: bold;">Volver</a>
</header>

<main>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${productos}">
        <td th:text="${p.id}"></td>
        <td>
          <img th:if="${p.imagen != null}" 
               th:src="@{'/uploads/' + ${p.imagen}}" 
               width="60" height="60" 
               alt="Sin imagen">
        </td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.descripcion}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.stock}"></td>
        <td>
          <a th:href="@{/productos/editar/{id}(id=${p.id})}">Editar</a> |
          <a th:href="@{/productos/eliminar/{id}(id=${p.id})}"
             onclick="return confirm('¿Seguro que quieres eliminar este producto?')">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>

  <h3>Agregar producto</h3>
  <form th:action="@{/productos}" method="post" enctype="multipart/form-data">
      <input type="text" name="nombre" placeholder="Nombre" required>
      <textarea name="descripcion" placeholder="Descripción"></textarea>
      <input type="number" name="stock" placeholder="Stock" min="0">
      <input type="number" step="0.01" name="precio" placeholder="Precio">
      <input type="file" name="imagenArchivo" accept="image/*">
      <button type="submit">Guardar</button>
  </form>

</main>
</body>
</html>
